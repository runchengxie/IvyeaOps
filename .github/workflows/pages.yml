name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'configs/server.env.example'
      - 'src/client/**'
      - 'scripts/build-docs-site.py'
      - 'scripts/requirements-docs.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/client/package-lock.json
      - run: npm ci
        working-directory: src/client
      - run: npm run test:demo && npm run typecheck:demo && npm run build:demo
        working-directory: src/client
      - run: python -m pip install -r scripts/requirements-docs.txt
      - run: python scripts/build-docs-site.py --output _site --demo-dir src/client/dist-demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
